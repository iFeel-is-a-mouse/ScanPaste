<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title></title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;background:#1a1a2e;color:#fff;font-family:'Courier New',monospace;gap:0}
  .topbar{position:fixed;top:50px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;z-index:10;height:44px}
  .back-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:14px;cursor:pointer}
  .best{color:#ffd700;font-size:13px}
  pre{font-size:24px;line-height:1.2;margin:0;user-select:none;min-height:0}
  .road{color:rgba(255,255,255,.25)}
  .status{color:#ffd700;font-size:22px;min-height:1.3em}
  .speed{color:rgba(255,255,255,.4);font-size:14px}
  button{font-size:20px;padding:10px 36px;border:none;border-radius:24px;
    background:#ff8c5a;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px}
  button:active{transform:scale(.95)}
  button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" id="backBtn" onclick="goBack()"></button>
  <div class="best" id="bestDisplay"></div>
</div>
<pre id="air"></pre>
<pre id="chars"></pre>
<pre id="ground" class="road"></pre>
<pre id="pangram" class="road"></pre>
<pre id="status" class="status"></pre>
<div class="speed" id="speedInfo"></div>
<button id="btnJump"></button>

<script>
'use strict';

/*
 * No user-visible copy is hardcoded in this file. All labels arrive from
 * Android.getUiStrings() (strings.xml / values-zh) and the sprite + pangram
 * configuration arrives from Android.getGame() (game.txt).
 */
var T = {};

/* ────────────── Game config (loaded from game.txt, defaults from Android) ────────────── */
var RABBIT  = '🐰';
var FOX     = '🦊';
var PANGRAM = '';

/* ────────────── DOM references ────────────── */
var air       = document.getElementById('air');
var chars     = document.getElementById('chars');
var ground    = document.getElementById('ground');
var pangram   = document.getElementById('pangram');
var statusEl  = document.getElementById('status');
var speedInfo = document.getElementById('speedInfo');
var btn       = document.getElementById('btnJump');
var bestDisplay = document.getElementById('bestDisplay');
var backBtn   = document.getElementById('backBtn');

/* ────────────── Bridge calls ────────────── */
function callBridge(name, fallback) {
  try {
    if (window.Android && typeof Android[name] === 'function') {
      var value = Android[name]();
      return value === undefined || value === null ? fallback : value;
    }
  } catch (e) {
    /* fall through to the fallback value */
  }
  return fallback;
}

/*
 * Replaces positional %n$s / %n$d placeholders only (1-based, e.g. %1$s %2$d).
 * Do NOT use bare %s / %d, width or flag modifiers (%1$02d), or %% here:
 * they are not supported and would be rendered literally. The same restriction
 * applies to every value in strings.xml that is pushed through this function.
 */
function format(template, args) {
  if (!template) return '';
  return template.replace(/%(\d+)\$[sd]/g, function(match, index) {
    var value = args[parseInt(index, 10) - 1];
    return value === undefined || value === null ? '' : String(value);
  });
}

function levelLabel(n) {
  return format(T.level, [n]);
}

/* ────────────── UI strings ────────────── */
function loadStrings() {
  var raw = callBridge('getUiStrings', '');
  if (raw) {
    try {
      T = JSON.parse(raw) || {};
    } catch (e) {
      T = {};
    }
  }
  document.documentElement.lang = T.lang || 'en';
  document.title = T.title || '';
  backBtn.textContent = T.back || '';
}

/* ────────────── Game config ────────────── */
function loadGameConfig() {
  var data = callBridge('getGame', '');
  if (data) {
    var lines = data.split('\n');
    if (lines.length >= 1 && lines[0].trim()) RABBIT  = lines[0].trim();
    if (lines.length >= 2 && lines[1].trim()) FOX     = lines[1].trim();
    if (lines.length >= 3 && lines[2].trim()) PANGRAM = lines[2].trim();
  }
  if (!PANGRAM) PANGRAM = T.pangram || '';
}

/* ────────────── Constants ────────────── */
var COLS       = 30;
var FOX_POS    = 15;
var FPS        = 10;
var FRAME_MS   = 1000 / FPS;
var JUMP_DIST  = 5;
var JUMP_FRAMES= 4;
var ROAD       = '~*';

/* ────────────── Game state ────────────── */
var rabbitPos  = 0;
var posAccum   = 0;
var rabbitState= 'walk';       // 'walk' | 'jump' | 'dead'
var jumpStart  = 0;
var jumpFrame  = 0;
var speed      = 0.5;
var level      = 1;
var bestLevel  = 0;
var bestTime   = '';

/* ────────────── Android bridge ────────────── */
function goBack() {
  if (window.Android && typeof Android.back === 'function') {
    Android.back();
  }
}

function loadBest() {
  var data = callBridge('getBest', '');
  if (data) {
    var parts = data.split(',');
    bestLevel = parseInt(parts[0], 10) || 0;
    bestTime  = parts[1] || '';
  }
  updateBestDisplay();
}

function updateBestDisplay() {
  if (bestLevel > 0) {
    bestDisplay.textContent = format(T.bestFormat, [levelLabel(bestLevel), bestTime]);
  } else {
    bestDisplay.textContent = T.bestEmpty || '';
  }
}

function updateButtonText() {
  btn.textContent = RABBIT + (T.jump ? ' ' + T.jump : '');
}

function saveBest() {
  var now     = new Date();
  var timeStr = now.getFullYear() + '-' +
    pad2(now.getMonth() + 1) + '-' +
    pad2(now.getDate()) + ' ' +
    pad2(now.getHours()) + ':' +
    pad2(now.getMinutes()) + ':' +
    pad2(now.getSeconds());

  if (level > bestLevel) {
    bestLevel = level;
    bestTime  = timeStr;
    updateBestDisplay();
    statusEl.textContent = format(T.newRecord, [levelLabel(bestLevel)]) +
      (bestTime ? ' ' + bestTime : '');
    if (window.Android && typeof Android.saveBest === 'function') {
      // Returns false when the write failed; the Activity logs it.
      Android.saveBest(bestLevel + ',' + bestTime);
    }
  }
}

/* ────────────── Utilities ────────────── */
function pad2(n) {
  return String(n).padStart(2, '0');
}

/* ────────────── Hint system ────────────── */
function showJumpHint() {
  if (rabbitPos < 11) { statusEl.textContent = T.hintEarly || ''; return; }
  if (rabbitPos > 14) { statusEl.textContent = T.hintLate || ''; return; }
  var landing = jumpStart + JUMP_DIST;
  var gap     = landing - FOX_POS;

  if (gap >= 4)       { statusEl.textContent = T.hintPerfect || ''; }
  else if (gap >= 3)  { statusEl.textContent = T.hintGreat || ''; }
  else if (gap >= 2)  { statusEl.textContent = T.hintNice || ''; }
  else if (gap >= 1)  { statusEl.textContent = T.hintRisky || ''; }
}

function hideHint() {
  statusEl.textContent = '';
}

/* ────────────── Initialization ────────────── */
function showSpeed() {
  speedInfo.textContent = format(T.speedInfo, [levelLabel(level), speed.toFixed(2)]);
}

function init() {
  rabbitPos   = 0;
  posAccum    = -speed + 0.01;
  rabbitState = 'walk';
  jumpStart   = 0;
  jumpFrame   = 0;
  btn.disabled = false;
  updateButtonText();
  hideHint();
  showSpeed();
}

function fullReset() {
  speed = 0.5;
  level = 1;
  posAccum = -speed + 0.01;
  rabbitPos = 0;
  rabbitState = 'walk';
  jumpStart = 0;
  jumpFrame = 0;
  btn.disabled = false;
  updateButtonText();
  hideHint();
  showSpeed();
}

function nextLevel() {
  level++;
  speed *= 1.2;
  saveBest();
  statusEl.textContent = T.levelClear || '';
  setTimeout(hideHint, 1000);
  showSpeed();
  rabbitPos   = 0;
  posAccum    = -speed + 0.01;
  rabbitState = 'walk';
  jumpStart   = 0;
  jumpFrame   = 0;
  btn.disabled = false;
  updateButtonText();
}

/* ────────────── Jump ────────────── */
function jump() {
  if (rabbitState === 'dead') { fullReset(); return; }
  if (rabbitState !== 'walk') return;

  // Only positions 11-14 can successfully jump over the fox
  if (rabbitPos < 11 || rabbitPos > 14) {
    statusEl.textContent = T.hintEarly || '';
    setTimeout(hideHint, 800);
  }

  jumpStart   = rabbitPos;
  rabbitState = 'jump';
  jumpFrame   = 0;
  btn.disabled = true;
  showJumpHint();
}

/* ────────────── Game update ────────────── */
function update() {
  /* ── Dead state: nothing updates ── */
  if (rabbitState === 'dead') {
    return;
  }

  /* ── Walking state ── */
  if (rabbitState === 'walk') {
    posAccum += speed;
    rabbitPos = Math.floor(posAccum);

    /* Death check */
    if (rabbitPos === FOX_POS) {
      rabbitState  = 'dead';
      saveBest();
      btn.disabled = true;
      posAccum = -speed + 0.01;
      var cd = 3;
      btn.textContent = '❤️ '.repeat(cd);
      var timer = setInterval(function() {
        cd--;
        if (cd > 0) { btn.textContent = '❤️ '.repeat(cd); }
        else { btn.disabled = false; btn.textContent = T.retry || ''; clearInterval(timer); }
      }, 1000);
      return;
    }

    /* Level-clear check */
    if (rabbitPos >= COLS) {
      nextLevel();
      return;
    }
  }

  /* ── Jump state ── */
  if (rabbitState === 'jump') {
    jumpFrame++;

    /* Compute current frame position (linear interpolation) */
    var t       = Math.min(jumpFrame / JUMP_FRAMES, 1);
    var dist    = JUMP_DIST;
    rabbitPos   = Math.round(jumpStart + dist * t);
    posAccum    = rabbitPos;

    /* Jump finished */
    if (t >= 1) {
      rabbitPos = jumpStart + dist;
      posAccum  = rabbitPos;

      /* Landing check: did we hit the fox */
      if (rabbitPos === FOX_POS) {
        rabbitState  = 'dead';
        saveBest();
        btn.disabled = true;
        posAccum = -speed + 0.01;
        var cd2 = 3;
        btn.textContent = '❤️ '.repeat(cd2);
        var timer2 = setInterval(function() {
          cd2--;
          if (cd2 > 0) { btn.textContent = '❤️ '.repeat(cd2); }
          else { btn.disabled = false; btn.textContent = T.retry || ''; clearInterval(timer2); }
        }, 1000);
        return;
      }

      /* Landing check: level cleared */
      if (rabbitPos >= COLS) {
        nextLevel();
        return;
      }

      /* Safe landing -> resume walking */
      rabbitState  = 'walk';
      btn.disabled = false;
      hideHint();
    }
  }
}

/* ────────────── Rendering ────────────── */
function draw() {
  var i;
  var airLine  = '';
  var charLine = '';

  /* ── Sky layer: show the rabbit while jumping ── */
  for (i = 0; i < COLS; i++) {
    if (rabbitState === 'jump') {
      var t      = Math.min(jumpFrame / JUMP_FRAMES, 1);
      var height = Math.sin(t * Math.PI);
      if (height > 0.15 && i === rabbitPos) {
        airLine += RABBIT;
      } else {
        airLine += ' ';
      }
    } else {
      airLine += ' ';
    }
  }
  air.textContent = airLine;

  /* ── Ground character layer ── */
  for (i = 0; i < COLS; i++) {
    if (rabbitState === 'walk' && i === Math.min(rabbitPos, COLS - 1)) {
      charLine += RABBIT;
    } else if (i === FOX_POS) {
      charLine += FOX;
    } else {
      charLine += ' ';
    }
  }
  chars.textContent = charLine;

  /* ── Static decoration ── */
  ground.textContent  = ROAD.repeat(COLS / 2);
  pangram.textContent = PANGRAM;
}

/* ────────────── Main loop ────────────── */
function loop() {
  update();
  draw();
  setTimeout(loop, FRAME_MS);
}

/* ────────────── Event wiring ────────────── */
btn.addEventListener('click', jump);
document.addEventListener('touchstart', function(e) {
  if (e.target.tagName !== 'BUTTON') {
    jump();
  }
});

/* ────────────── Startup ────────────── */
loadStrings();
loadGameConfig();
loadBest();
init();
loop();
</script>
</body>
</html>
